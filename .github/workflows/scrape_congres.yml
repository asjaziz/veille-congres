name: Scrape Congrès Académiques

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 python-dateutil
      - run: python scrape_congres.py
      - run: git config user.name "github-actions"
      - run: git config user.email "actions@github.com"
      - run: git add veille_congres.json veille_congres.md
      - run: git commit -m "Mise à jour automatique" || echo "Rien à committer"
      - run: git push
